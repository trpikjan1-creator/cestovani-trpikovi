<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e9aa7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cestování">
<title>Cestování</title>
</head>
<body>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#182430; --mut:#5b6b7a; --line:#e2e8ef;
  --accent:#0e9aa7; --accentink:#0a6f78; --danger:#d5484a; --shadow:0 1px 3px rgba(20,40,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px}
.app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(14,110,140,.25)}
.top h1{font-size:18px;font-weight:800;margin:0;letter-spacing:.2px;flex:1;display:flex;align-items:center;gap:8px}
.top .sub{font-size:12px;font-weight:600;opacity:.85}
.iconbtn{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;font-size:14px}
.iconbtn:hover{background:rgba(255,255,255,.3)}
.back{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:9px;padding:8px 11px;font-weight:800}

.wrap{padding:16px}
.muted{color:var(--mut)}
.center{text-align:center}

/* trip cards */
.tripcard{display:flex;align-items:stretch;gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.tripcard .stripe{width:7px;flex:none}
.tripcard .body{padding:14px 16px;flex:1;min-width:0}
.tripcard .body h2{margin:0 0 3px;font-size:18px;font-weight:800}
.tripcard .meta{font-size:13px;color:var(--mut)}
.tripcard .go{align-self:center;padding:0 16px;color:var(--mut);font-size:26px;font-weight:800}

/* trip header */
.thead{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px;border-left:7px solid var(--accent)}
.thead h2{margin:0 0 4px;font-size:22px;font-weight:800}
.thead .tsub{font-size:14px;color:var(--mut)}
.thead .trow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* day */
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.day.leftover{background:#fffbeb;border-color:#f0dc9a}
.dhead{display:flex;align-items:center;gap:12px;padding:13px 15px;background:#eef4f8;border-bottom:1px solid var(--line)}
.day.leftover .dhead{background:#fdf3c9}
.dnum{background:var(--accent);color:#fff;font-weight:800;border-radius:9px;padding:7px 11px;font-size:13px;text-align:center;white-space:nowrap;line-height:1.15}
.dnum small{display:block;font-size:10px;font-weight:600;opacity:.9}
.dtitle{flex:1;min-width:0}
.dtitle b{font-size:16px;font-weight:800;display:block}
.dtitle .dm{font-size:12.5px;color:var(--mut)}

/* stop */
.stop{padding:11px 15px;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:none}
.stoptop{display:flex;gap:10px;align-items:baseline}
.time{font-weight:800;color:var(--accentink);font-size:14px;flex:none;min-width:44px}
.sname{font-weight:700;font-size:15px;flex:1;min-width:0}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e8eef3;color:#4a5b6a;white-space:nowrap}
.sdesc{font-size:14px;color:#40515f;margin:5px 0 0 54px}
.sbtns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px 54px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;text-decoration:none;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#f7fafc;color:var(--accentink)}
.pill:hover{background:#eef4f8}
.pill.price{color:#7a5b12;background:#fff8e6;border-color:#f0dc9a}
.pill.mini{border:none;background:transparent;padding:5px 7px;color:var(--mut)}
.pill.mini:hover{background:#eef2f6}
.pill.del:hover{background:#fdecec;color:var(--danger)}

.addrow{padding:10px 15px}
.addbtn{width:100%;border:1.5px dashed #c3d2de;background:#f7fafc;color:var(--accentink);border-radius:10px;padding:10px;font-weight:700;font-size:14px}
.addbtn:hover{background:#eef4f8}
.addday{margin-top:2px}

/* generic buttons */
.btn{border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accentink)}
.btn.ghost{background:#eef2f6;color:var(--ink)}
.btn.danger{background:#fbeaea;color:var(--danger)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}

/* empty */
.empty{text-align:center;padding:48px 20px;color:var(--mut)}
.empty .big{font-size:44px;margin-bottom:8px}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(15,30,45,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.ovl.open{display:flex}
@media(min-width:560px){.ovl{align-items:center;padding:20px}}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;box-shadow:0 -4px 30px rgba(0,0,0,.25)}
@media(min-width:560px){.sheet{border-radius:16px}}
.sheet h3{margin:0;padding:16px 18px;font-size:18px;font-weight:800;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.form{padding:16px 18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fbfcfd;color:var(--ink)}
.field textarea{min-height:78px;resize:vertical}
.formbtns{display:flex;gap:10px;padding:4px 18px 20px}
.formbtns .btn{flex:1}
.delzone{padding:0 18px 18px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#182430;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:.96}
.footnote{text-align:center;color:#9aabb8;font-size:12px;padding:10px 16px 40px}
.syncbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.2)}
</style>

<div class="app">
  <div class="top">
    <button class="back" id="backBtn" data-act="back" hidden>‹</button>
    <h1>✈️ Cestování <span class="syncbadge" id="syncBadge" hidden></span></h1>
    <button class="iconbtn" id="addTripBtn" data-act="addTrip">+ Cesta</button>
  </div>
  <div class="wrap" id="view"></div>
  <div class="footnote" id="foot"></div>
</div>

<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
var SEED_TRIPS=[{"base": "Le Palmiste Resort & Spa, Trou aux Biches", "color": "#0e9aa7", "dateFrom": "2026-09-17", "dateTo": "2026-09-23", "days": [{"date": "čt 17. 9.", "id": "d1", "label": "DEN 1", "leftover": false, "meta": "Přílet a aktivní start na severu", "stops": [{"category": "Přesun", "desc": "(jihovýchod) — pasová kontrola, přesun na sever. Auto řešíme zvlášť (viz sekce Auto níže); z letiště na hotel ~1 h 10 min.", "id": "s1_letiste", "mapQuery": "Sir Seewoosagur Ramgoolam International Airport, Mauritius", "name": "Přílet na letiště SSR", "price": "", "time": "dopo"}, {"category": "Přesun", "desc": "rychle vybalit a hurá ven. Jezdí se vlevo — prvních pár kruháčů v klidu.", "id": "s2_hotel", "mapQuery": "Le Palmiste Resort & Spa, Trou aux Biches, Mauritius", "name": "Check-in Le Palmiste Resort & Spa", "price": "", "time": "14:00"}, {"category": "Zvířata", "desc": "(Pointe aux Piments, 10 min od hotelu) — žraloci, želvy, murény a korálové nádrže; příjemný aktivní start po cestě. Vstup ~Rs 500 ≈ 225 Kč/os.", "id": "s3_x", "mapQuery": "Mauricijské akvárium, Mauritius", "name": "Mauricijské akvárium", "price": "~Rs 500 ≈ 225 Kč/os.", "time": "15:00"}, {"category": "Pláž", "desc": "nejdelší pláž severu; půjčení SUP nebo šnorchlu přímo na místě, teplá klidná laguna. 10 min", "id": "s4_mont_choisy", "mapQuery": "Mont Choisy Beach, Mauritius", "name": "Šnorchl / paddleboard u Mont Choisy", "price": "zdarma", "time": "16:30"}, {"category": "Pláž", "desc": "slunce zapadá ~18:10 přímo nad mořem; večeře v některé z restaurací podél pláže nebo v Trou aux Biches.", "id": "s5_x", "mapQuery": "Západ slunce a večeře, Mauritius", "name": "Západ slunce a večeře", "price": "", "time": "18:00"}]}, {"date": "pá 18. 9.", "id": "d2", "label": "DEN 2", "leftover": false, "meta": "Velryby a výšlap na Le Morne Brabant 🐋⛰️", "stops": [{"category": "Přesun", "desc": "po prázdné dálnici do Black River. ~1 h", "id": "s1_x", "mapQuery": "Brzký odjezd na západ, Mauritius", "name": "Brz function loadLocal(){try{return JSON.parse(localStorage.getItem(LS))||{};}catch(e){return {};}}

function tripsSorted(){
  return Object.keys(state.trips).map(function(k){return state.trips[k];})
    .sort(function(a,b){return (a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name));});
}

// ---------- storage ----------
async function persistTrip(t){
  state.trips[t.id]=t; saveLocal(); render();
  if(dbMode&&db){try{await db.doc("trips/"+t.id).set(t);}catch(e){toast("Ukládání do cloudu selhalo");}}
}
async function removeTrip(id){
  delete state.trips[id]; saveLocal();
  if(state.tripId===id){state.view="list";state.tripId=null;}
  render();
  if(dbMode&&db){try{await db.doc("trips/"+id).delete();}catch(e){}}
}

async function initStore(){
  state.trips=loadLocal();
  if(!Object.keys(state.trips).length&&typeof SEED_TRIPS!=="undefined"){SEED_TRIPS.forEach(function(t){state.trips[t.id]=t;});saveLocal();}
  render();
  if(window.claude&&typeof claude.use==="function"){
    var got=null;
    try{got=await claude.use("db");}catch(e){got=null;}
    if(got){
      db=got;dbMode=true;
      var pending=loadLocal(); // migrate any pre-db local trips
      var first=true;
      try{
        db.collection("trips").onSnapshot(function(snap){
          var t={};
          snap.docs.forEach(function(d){if(d.exists){t[d.id]=d.data();}});
          if(first){
            first=false;dbReady=true;
            // push local-only trips that aren't in the cloud yet
            Object.keys(pending).forEach(function(id){
              if(!t[id]){t[id]=pending[id];try{db.doc("trips/"+id).set(pending[id]);}catch(e){}}
            });
          }
          state.trips=t;saveLocal();render();
          setSync(true);
        },function(err){setSync(false);});
      }catch(e){dbMode=false;}
      setSync(true);
    }else{
      setSync(false);
    }
  }else{
    setSync(false);
  }
}
function setSync(on){
  var b=el("syncBadge");
  if(on){b.hidden=false;b.textContent="☁ sync";}
  else{b.hidden=true;}
}

// ---------- rendering ----------
function fmtRange(t){
  function d(x){if(!x)return "";var p=x.split("-");return p.length===3?(p[2]+". "+p[1]+"."):x;}
  var a=d(t.dateFrom),b=d(t.dateTo);
  if(a&&b)return a+" – "+b+" 2026".replace("2026",(t.dateTo||"").split("-")[0]||"");
  return a||b||"";
}
function render(){
  var v=el("view");
  el("backBtn").hidden = state.view==="list";
  el("addTripBtn").hidden = state.view!=="list";
  if(state.view==="list"){renderList(v);}
  else{renderTrip(v);}
}

function renderList(v){
  var trips=tripsSorted();
  el("foot").textContent="Data se ukládají "+(dbMode?"do cloudu a synchronizují mezi tvými zařízeními.":"v tomto prohlížeči.");
  if(!trips.length){
    v.innerHTML='<div class="empty"><div class="big">🌍</div><b>Zatím žádná cesta</b><div class="muted" style="margin:6px 0 18px">Vytvoř si první itinerář — dny a zastávky s časy, cenami a mapou.</div><button class="btn primary" data-act="addTrip">+ Nová cesta</button></div>';
    return;
  }
  var h="";
  trips.forEach(function(t){
    var nd=(t.days||[]).length, ns=(t.days||[]).reduce(function(a,d){return a+((d.stops||[]).length);},0);
    h+='<div class="tripcard" data-act="openTrip" data-id="'+esc(t.id)+'">'
      +'<div class="stripe" style="background:'+esc(t.color||"#0e9aa7")+'"></div>'
      +'<div class="body"><h2>'+esc(t.name||"Bez názvu")+'</h2>'
      +'<div class="meta">'+esc(fmtRange(t))+(t.base?' · '+esc(t.base):'')+'</div>'
      +'<div class="meta" style="margin-top:4px">'+nd+' '+plural(nd,"den","dny","dní")+' · '+ns+' '+plural(ns,"zastávka","zastávky","zastávek")+'</div>'
      +'</div><div class="go">›</div></div>';
  });
  v.innerHTML=h;
}
function plural(n,a,b,c){n=Math.abs(n);if(n===1)return a;if(n>=2&&n<=4)return b;return c;}

  el("foot").textContent="";
  var h='<div class="thead" style="border-left-color:'+esc(t.color||"#0e9aa7")+'">'
    +'<h2>'+esc(t.name)+'</h2>'

    (d.stops||[]).forEach(function(s,si){
      var catcol=CATCOL[s.category]||CATCOL["Ostatní"];
      h+='<div class="stop">';
      h+='<div class="stoptop">'+(s.time?'<span class="time">'+esc(s.time)+'</span>':'<span class="time"></span>')

      if(s.desc)h+='<div class="sdesc">'+esc(s.desc)+'</div>';
      h+='<div class="sbtns">';

      h+='<a class="pill" href="https://www.google.com/maps/search/?api=1&query='+mapq+'" target="_blank" rel="noopener">📍 Mapa</a>';

      h+='<button class="pill mini" data-act="editStop" data-di="'+di+'" data-si="'+si+'">✎ Upravit</button>';
      h+='</div></div>';

    h+='</div>';

function currentTrip(){return state.trips[state.tripId];}
function move(arr,i,dir){var j=i+dir;if(j<0||j>=arr.length)return false;var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;return true;}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act");
  var di=b.getAttribute("data-di"), si=b.getAttribute("data-si");
  di=di==null?null:parseInt(di,10); si=si==null?null:parseInt(si,10);
  var t=currentTrip();

  if(act==="back"){state.view="list";state.tripId=null;render();}
  else if(act==="addTrip"){tripForm(null);}
  else if(act==="openTrip"){state.tripId=b.getAttribute("data-id");state.view="trip";render();window.scrollTo(0,0);}
  else if(act==="cancel"){closeSheet();}
  else if(act==="editTrip"){tripForm(t);}
  else if(act==="saveTrip"){
    var f=readFields();var id=b.getAttribute("data-id");var isNew=b.getAttribute("data-new")==="1";
    var existing=state.trips[id]||{days:[],order:tripsSorted().length};
    var trip=Object.assign({},existing,{id:id,name:f.name||"Bez názvu",subtitle:f.subtitle||"",dateFrom:f.dateFrom||"",dateTo:f.dateTo||"",base:f.base||"",color:el("sheet")._draftColor||"#0e9aa7"});
    if(!trip.days)trip.days=[];
    closeSheet();persistTrip(trip);
    if(isNew){state.tripId=id;state.view="trip";render();}
    toast("Uloženo");
  }
  else if(act==="delTrip"){if(confirm("Opravdu smazat celou cestu i se všemi dny?")){var id=b.getAttribute("data-id");closeSheet();removeTrip(id);toast("Cesta smazána");}}
  else if(act==="addDay"){dayForm(null);}
  else if(act==="editDay"){dayForm(di);}
  else if(act==="saveDay"){
    var f=readFields();var d={label:f.label||"",date:f.date||"",meta:f.meta||"",leftover:f.leftover==="1"};
    if(di===-1){d.stops=[];d.id=genId();(t.days=t.days||[]).push(d);}
    else{d.stops=t.days[di].stops||[];d.id=t.days[di].id||genId();t.days[di]=d;}
    closeSheet();persistTrip(t);toast("Uloženo");
  }
  else if(act==="delDay"){if(confirm("Smazat tento den i jeho zastávky?")){t.days.splice(di,1);closeSheet();persistTrip(t);toast("Den smazán");}}
  else if(act==="dayUp"){if(move(t.days,di,-1))persistTrip(t);}
  else if(act==="dayDown"){if(move(t.days,di,1))persistTrip(t);}
  else if(act==="addStop"){stopForm(di,null);}
  else if(act==="editStop"){stopForm(di,si);}
  else if(act==="saveStop"){
    var f=readFields();var s={time:f.time||"",name:f.name||"",category:f.category||"Ostatní",price:f.price||"",desc:f.desc||"",mapQuery:f.mapQuery||""};
    var day=t.days[di];day.stops=day.stops||[];
    if(si===-1){s.id=genId();day.stops.push(s);}else{s.id=day.stops[si].id||genId();day.stops[si]=s;}
    closeSheet();persistTrip(t);toast("Uloženo");
  }
  else if(act==="delStop"){if(confirm("Smazat tuto zastávku?")){t.days[di].stops.splice(si,1);closeSheet();persistTrip(t);toast("Smazáno");}}
  else if(act==="stopUp"){if(move(t.days[di].stops,si,-1))persistTrip(t);}
  else if(act==="stopDown"){if(move(t.days[di].stops,si,1))persistTrip(t);}
});
el("ovl").addEventListener("click",function(e){if(e.target===el("ovl"))closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});

initStore();
})();
