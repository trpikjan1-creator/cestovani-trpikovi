<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3550">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cestování">
<title>Cestování</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
 --ink:#13303f; --mut:#5f7688; --bg:#eef2f6; --card:#ffffff; --line:#e4ebf1;
 --accent:#0e9aa7; --accentink:#0a6f78; --deep:#0b3550; --danger:#d5484a;
 --gold:#a9781f; --goldbg:#fff6e0; --goldln:#f0dca0;
 --sh:0 1px 3px rgba(19,48,63,.07); --sh2:0 10px 30px rgba(19,48,63,.16);
 --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
img{max-width:100%;display:block}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:inherit}
.app{max-width:820px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,53,80,.96);color:#fff;backdrop-filter:blur(8px);box-shadow:0 2px 14px rgba(11,53,80,.28)}
.top .tt{font-size:17px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.tbtn{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;color:#fff;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.28)}
.tbtn.lock.on{background:#2f9e63}
.wrap{padding:16px}
.muted{color:var(--mut)}

/* hero */
.hero{position:relative;min-height:230px;display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:linear-gradient(135deg,#0b3550,#0e9aa7)}
.hero .bg{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;z-index:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,30,45,.15) 0%,rgba(6,30,45,.35) 45%,rgba(6,30,45,.86) 100%);z-index:1}
.hero .hin{position:relative;z-index:2;padding:22px 18px 18px;width:100%}
.hero h1{margin:0;font-size:clamp(30px,7vw,44px);font-weight:800;letter-spacing:-.5px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero .hsub{margin-top:4px;font-size:14.5px;font-weight:500;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip2{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(4px);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:700}

/* trip cards (list) */
.tripcard{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);margin-bottom:14px;cursor:pointer;min-height:120px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(135deg,#0b3550,#0e9aa7)}
.tripcard .bg{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;z-index:0}
.tripcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,30,45,.05),rgba(6,30,45,.8));z-index:1}
.tripcard .cin{position:relative;z-index:2;padding:14px 16px;width:100%}
.tripcard h2{margin:0 0 3px;font-size:20px;font-weight:800;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.tripcard .cmeta{font-size:13px;font-weight:600;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.4)}

/* section heading */
.sec{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accentink);margin:26px 2px 12px}
.sec .ln{flex:1;height:1px;background:var(--line)}

/* trip header */
.thead{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:6px;border-left:6px solid var(--accent)}
.thead h2{margin:0 0 4px;font-size:22px;font-weight:800}
.thead .ts{font-size:13.5px;color:var(--mut);font-weight:600}
.ebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ebtn{background:#eef4f8;color:var(--accentink);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.ebtn:hover{background:#e2eef4}

/* day */
.day{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.day.leftover{background:#fffdf4}
.dhead{display:flex;align-items:center;gap:13px;padding:14px 16px;color:#fff}
.dnum{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:11px;padding:7px 12px;font-weight:800;font-size:14px;text-align:center;white-space:nowrap;line-height:1.15}
.dnum small{display:block;font-size:10.5px;font-weight:600;opacity:.92}
.dh-t{flex:1;min-width:0}
.dh-t b{font-size:16.5px;font-weight:800;display:block;line-height:1.25}
.dh-t .dm{font-size:12.5px;font-weight:600;opacity:.9}
.dh-btns{display:flex;gap:4px}
.dh-btns .ic{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
.dh-btns .ic:hover{background:rgba(255,255,255,.34)}

/* stop */
.stop{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:stretch}
.stop:first-child{border-top:none}
.stop:hover{background:#f7fafc}
.st-time{flex:none;width:46px;text-align:right;font-weight:800;font-size:13px;color:var(--accentink);padding-top:3px}
.st-thumb{flex:none;width:64px;height:64px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--dc,#0e9aa7),#0b2a3d);position:relative}
.st-thumb img{width:100%;height:100%;object-fit:cover}
.st-thumb .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:.9}
.st-main{flex:1;min-width:0}
.st-name{font-weight:700;font-size:15.5px;line-height:1.3}
.st-sub{margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cat{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e8eef3;color:#4a5b6a;white-space:nowrap}
.price{font-size:12px;font-weight:800;color:var(--gold);background:var(--goldbg);border:1px solid var(--goldln);border-radius:999px;padding:2px 8px;white-space:nowrap}
.travel{margin-top:5px;font-size:12.5px;font-weight:600;color:#7a8fa0}
.st-desc{margin-top:4px;font-size:13.5px;color:#48606f;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-chev{flex:none;align-self:center;color:#b7c6d0;font-size:22px;font-weight:800}
.addbtn{display:block;width:calc(100% - 28px);margin:12px 14px 14px;border:1.5px dashed #c3d3de;background:#f7fafc;color:var(--accentink);border-radius:11px;padding:11px;font-weight:700;font-size:14px}
.addbtn:hover{background:#eef4f8}

/* info section */
.icard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 17px;margin-bottom:14px}
.icard h3{margin:0 0 10px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.icard p{margin:0 0 6px;font-size:14.5px;color:#3f5564}
.rate{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rate span{background:#eef4f8;border-radius:9px;padding:6px 11px;font-size:13.5px;font-weight:700;color:var(--accentink)}
.btab{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
.btab td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.btab td.n{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.btab tr:first-child td{border-top:none}
.btot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;background:var(--deep);color:#fff;border-radius:12px;padding:12px 15px;font-weight:800;font-size:16px}
.bnote{font-size:12.5px;color:var(--mut);margin-top:9px}
.tips{margin:0;padding:0;list-style:none}
.tips li{font-size:14px;padding:8px 0;border-top:1px dashed var(--line);color:#3f5564}
.tips li:first-child{border-top:none}
.saf{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-top:10px}
.saf b{font-size:14.5px}
.saf .sp{color:var(--gold);font-weight:800;font-size:13.5px;margin:3px 0}
.saf .sn{font-size:13px;color:#5a6f7d}
.reco{background:#eafaf1;border:1px solid #b8e6cd;color:#1c6b42;border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-top:12px}

/* modal / detail */
.ovl{position:fixed;inset:0;background:rgba(9,26,38,.55);display:none;align-items:flex-end;justify-content:center;z-index:60;backdrop-filter:blur(3px)}
.ovl.open{display:flex}
@media(min-width:600px){.ovl{align-items:center;padding:20px}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;box-shadow:var(--sh2);-webkit-overflow-scrolling:touch}
@media(min-width:600px){.sheet{border-radius:20px}}
/* detail gallery */
.gal{position:relative;background:#0b2a3d;aspect-ratio:16/10;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .3s}
.gal img.on{opacity:1}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:3}
.gal .nav:hover{background:rgba(0,0,0,.65)}
.gal .prev{left:10px}.gal .next{right:10px}
.gal .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:3}
.gal .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.gal .dots i.on{background:#fff}
.gal .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(135deg,var(--dc,#0e9aa7),#0b2a3d)}
.gal .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:20px;font-weight:700;z-index:4}
.dbody{padding:18px 20px 22px}
.dbody .dcat{display:inline-block;font-size:12px;font-weight:800;padding:3px 11px;border-radius:999px;background:#e8eef3;color:#4a5b6a;margin-bottom:8px}
.dbody h3{margin:0 0 12px;font-size:23px;font-weight:800;line-height:1.2}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.fact{background:#f4f8fb;border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.fact .fl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.fact .fv{font-size:14px;font-weight:700;margin-top:1px}
.ddesc{font-size:15px;color:#39505f;line-height:1.6;margin-bottom:16px;white-space:pre-wrap}
.dlinks{display:flex;flex-wrap:wrap;gap:9px}
.lbtn{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;text-decoration:none;padding:10px 15px;border-radius:11px}
.lbtn.map{background:var(--accent);color:#fff}
.lbtn.map:hover{background:var(--accentink)}
.lbtn.ph{background:#eef4f8;color:var(--accentink)}
.dedit{display:flex;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.dedit button{flex:1;border-radius:11px;padding:11px;font-weight:700;font-size:14px}
.dedit .e{background:#eef4f8;color:var(--ink)}
.dedit .d{background:#fbeaea;color:var(--danger)}

/* forms */
.sheet h4{margin:0;padding:16px 20px;font-size:18px;font-weight:800;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.form{padding:16px 20px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fbfcfd;color:var(--ink)}
.field textarea{min-height:90px;resize:vertical}
.two{display:flex;gap:10px}.two>*{flex:1}
.fbtns{display:flex;gap:10px;padding:2px 20px 20px}
.fbtns button{flex:1;border-radius:11px;padding:12px;font-weight:700;font-size:15px}
.fbtns .save{background:var(--accent);color:#fff}
.fbtns .cancel{background:#eef2f6;color:var(--ink)}
.delz{padding:0 20px 20px}
.delz button{width:100%;background:#fbeaea;color:var(--danger);border-radius:11px;padding:12px;font-weight:700}
.pinbox{padding:18px 20px}
.pinbox input{width:100%;text-align:center;letter-spacing:8px;font-size:26px;font-weight:800;border:1px solid var(--line);border-radius:12px;padding:14px}

.empty{text-align:center;padding:52px 20px;color:var(--mut)}
.empty .big{font-size:46px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#13303f;color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:var(--sh2)}
.toast.show{opacity:.97}
.foot{text-align:center;color:#9fb0bc;font-size:12px;padding:12px 16px 46px}
.editbanner{background:#2f9e63;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:7px}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <button class="tbtn" id="backBtn" hidden>‹ Zpět</button>
  <div class="tt" id="topTitle">✈️ Cestování</div>
  <button class="tbtn" id="addTripBtn" hidden>+ Cesta</button>
  <button class="tbtn lock" id="lockBtn">🔒</button>
 </div>
 <div class="editbanner" id="editBanner" hidden>✏️ Režim úprav zapnutý — klepni na 🔓 pro zamčení</div>
 <div id="view"></div>
 <div class="foot" id="foot"></div>
</div>
<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

  +'<div class="dlinks"><a class="lbtn map" href="https://www.google.com/maps/search/?api=1&query='+mapq+'" target="_blank" rel="noopener">📍 Otevřít v mapě</a>'
  +'<a class="lbtn ph" href="https://www.google.com/search?tbm=isch&q='+phq+'" target="_blank" rel="noopener">📷 Více fotek</a></div>'
  +(state.edit?'<div class="dedit"><button class="e" data-act="edStop" data-di="'+di+'" data-si="'+si+'">✎ Upravit</button><button class="d" data-act="delStop" data-di="'+di+'" data-si="'+si+'">🗑 Smazat</button></div>':'')
  +'</div>';
 galState={imgs:ph,cur:0};
 openSheet(gal+body);
}
function galShow(i){var imgs=el("sheet").querySelectorAll('.gal img');var dots=el("sheet").querySelectorAll('.dots i');if(!imgs.length)return;var n=imgs.length;i=((i%n)+n)%n;imgs.forEach(function(m,k){m.classList.toggle('on',k===i);});dots.forEach(function(d,k){d.classList.toggle('on',k===i);});galState.cur=i;}

/* ---------- forms ---------- */
function fld(l,n,v,t,ph){return '<div class="field"><label>'+esc(l)+'</label><input type="'+(t||"text")+'" data-f="'+n+'" value="'+esc(v||"")+'" placeholder="'+esc(ph||"")+'"></div>';}
function area(l,n,v,ph){return '<div class="field"><label>'+esc(l)+'</label><textarea data-f="'+n+'" placeholder="'+esc(ph||"")+'">'+esc(v||"")+'</textarea></div>';}
function readF(){var o={};el("sheet").querySelectorAll("[data-f]").forEach(function(i){o[i.getAttribute("data-f")]=i.value;});return o;}
function tripForm(t){var isNew=!t;t=t||{id:gid(),name:"",subtitle:"",dateFrom:"",dateTo:"",base:"",color:"#0e9aa7",order:tripsSorted().length,days:[]};
 openSheet('<h4>'+(isNew?"Nová cesta":"Upravit cestu")+'</h4><div class="form">'+fld("Název","name",t.name,"text","např. Řecko 2027")+fld("Podtitul","subtitle",t.subtitle,"text","hotel, styl…")+'<div class="two">'+fld("Od","dateFrom",t.dateFrom,"date")+fld("Do","dateTo",t.dateTo,"date")+'</div>'+fld("Základna / hotel","base",t.base,"text","")+'</div><div class="fbtns"><button class="cancel" data-act="cancel">Zrušit</button><button class="save" data-act="saveTrip" data-id="'+esc(t.id)+'" data-new="'+(isNew?1:0)+'">Uložit</button></div>'+(isNew?'':'<div class="delz"><button data-act="delTrip" data-id="'+esc(t.id)+'">🗑 Smazat celou cestu</button></div>'));}
function dayForm(di){var t=state.trips[state.tripId],isNew=(di==null);var d=isNew?{label:"DEN "+((t.days||[]).length+1),date:"",meta:"",leftover:false}:t.days[di];
 openSheet('<h4>'+(isNew?"Nový den":"Upravit den")+'</h4><div class="form">'+fld("Označení","label",d.label,"text","DEN 3")+fld("Datum","date",d.date,"text","so 19. 9.")+fld("Nadpis dne","meta",d.meta,"text","")+'<div class="field"><label>Typ</label><select data-f="leftover"><option value="0"'+(d.leftover?"":" selected")+'>Běžný den</option><option value="1"'+(d.leftover?" selected":"")+'>Nápady / k rozhodnutí</option></select></div></div><div class="fbtns"><button class="cancel" data-act="cancel">Zrušit</button><button class="save" data-act="saveDay" data-di="'+(isNew?-1:di)+'">Uložit</button></div>'+(isNew?'':'<div class="delz"><button data-act="delDay" data-di="'+di+'">🗑 Smazat den</button></div>'));}
function stopForm(di,si){var t=state.trips[state.tripId],isNew=(si==null);var s=isNew?{time:"",name:"",category:"Ostatní",price:"",desc:"",mapQuery:"",travel:"",photos:[]}:t.days[di].stops[si];
 var opts=CATS.map(function(c){return '<option'+(s.category===c?" selected":"")+'>'+c+'</option>';}).join("");
 openSheet('<h4>'+(isNew?"Nová zastávka":"Upravit zastávku")+'</h4><div class="form"><div class="two">'+fld("Čas","time",s.time,"text","9:00")+'<div class="field"><label>Kategorie</label><select data-f="category">'+opts+'</select></div></div>'+fld("Název","name",s.name,"text","")+area("Popis","desc",s.desc,"")+fld("Cena","price",s.price,"text","~200 Kč")+fld("Čas přesunu","travel",s.travel,"text","🚗 ~30 min")+fld("Mapa (co hledat)","mapQuery",s.mapQuery,"text","")+'</div><div class="fbtns"><button class="cancel" data-act="cancel">Zrušit</button><button class="save" data-act="saveStop" data-di="'+di+'" data-si="'+(isNew?-1:si)+'">Uložit</button></div>'+(isNew?'':'<div class="delz"><button data-act="delStop" data-di="'+di+'" data-si="'+si+'">🗑 Smazat zastávku</button></div>'));}

function move(a,i,d){var j=i+d;if(j<0||j>=a.length)return false;var x=a[i];a[i]=a[j];a[j]=x;return true;}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-act]");if(!b)return;
 var act=b.getAttribute("data-act");
 var di=b.getAttribute("data-di"),si=b.getAttribute("data-si");
 di=di==null?null:parseInt(di,10);si=si==null?null:parseInt(si,10);
 var t=state.trips[state.tripId];
 if(act==="open"){state.tripId=b.getAttribute("data-id");state.view="trip";render();window.scrollTo(0,0);}
 else if(act==="cancel"){closeSheet();}
 else if(act==="detail"){openDetail(di,si);}
 else if(act==="gprev"){galShow(galState.cur-1);}
 else if(act==="gnext"){galShow(galState.cur+1);}
 else if(act==="edStop"){stopForm(di,si);}
 else if(act==="edDay"){dayForm(di);}
 else if(act==="editTrip"){tripForm(t);}
 else if(act==="addDay"){dayForm(null);}
 else if(act==="addStop"){stopForm(di,null);}
 else if(act==="dup"){if(move(t.days,di,-1))persist(t);}
 else if(act==="ddn"){if(move(t.days,di,1))persist(t);}
 else if(act==="saveTrip"){var f=readF();var id=b.getAttribute("data-id");var isNew=b.getAttribute("data-new")==="1";var ex=state.trips[id]||{days:[],order:tripsSorted().length};var nt=Object.assign({},ex,{id:id,name:f.name||"Bez názvu",subtitle:f.subtitle||"",dateFrom:f.dateFrom||"",dateTo:f.dateTo||"",base:f.base||""});if(!nt.days)nt.days=[];closeSheet();persist(nt);if(isNew){state.tripId=id;state.view="trip";render();}toast("Uloženo ✓");}
 else if(act==="delTrip"){if(confirm("Smazat celou cestu?")){closeSheet();removeTrip(b.getAttribute("data-id"));toast("Smazáno");}}
 else if(act==="saveDay"){var f=readF();var nd={label:f.label||"",date:f.date||"",meta:f.meta||"",leftover:f.leftover==="1"};if(di===-1){nd.stops=[];nd.id=gid();(t.days=t.days||[]).push(nd);}else{nd.stops=t.days[di].stops||[];nd.id=t.days[di].id||gid();t.days[di]=nd;}closeSheet();persist(t);toast("Uloženo ✓");}
 else if(act==="delDay"){if(confirm("Smazat den i zastávky?")){t.days.splice(di,1);closeSheet();persist(t);toast("Smazáno");}}
 else if(act==="saveStop"){var f=readF();var os=(si!==-1?t.days[di].stops[si]:{});var s={id:os.id||gid(),time:f.time||"",name:f.name||"",category:f.category||"Ostatní",price:f.price||"",desc:f.desc||"",mapQuery:f.mapQuery||"",travel:f.travel||"",photos:os.photos||[]};var day=t.days[di];day.stops=day.stops||[];if(si===-1)day.stops.push(s);else day.stops[si]=s;closeSheet();persist(t);toast("Uloženo ✓");}
 else if(act==="delStop"){if(confirm("Smazat zastávku?")){t.days[di].stops.splice(si,1);closeSheet();persist(t);toast("Smazáno");}}
 else if(act==="pinok"){var v=(el("pinInp")||{}).value||"";if(v.length<4){toast("PIN musí mít 4 číslice");return;}var creating=b.getAttribute("data-c")==="1";if(creating){try{localStorage.setItem(PINK,hash(v));}catch(e){}state.edit=true;closeSheet();render();toast("Úpravy odemčeny 🔓");}else{var saved=null;try{saved=localStorage.getItem(PINK);}catch(e){}if(hash(v)===saved){state.edit=true;closeSheet();render();toast("Úpravy odemčeny 🔓");}else{toast("Špatný PIN");}}}
});
el("backBtn").addEventListener("click",function(){state.view="list";state.tripId=null;render();});
el("addTripBtn").addEventListener("click",function(){tripForm(null);});
el("lockBtn").addEventListener("click",toggleLock);
el("ovl").addEventListener("click",function(e){if(e.target===el("ovl"))closeSheet();});
el("sheet").addEventListener("click",function(e){var d=e.target.closest(".dots i");if(d)galShow(parseInt(d.getAttribute("data-i"),10));});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
init();
})();
</script>
</body>
</html>
